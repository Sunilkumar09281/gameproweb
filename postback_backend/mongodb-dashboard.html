<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Integration Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(10px);
        }
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        .stat-label {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        .section h2 {
            color: #00d4ff;
            margin-top: 0;
        }
        .test-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .leaderboard-table th,
        .leaderboard-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .leaderboard-table th {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            font-weight: bold;
        }
        .activity-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #00d4ff;
        }
        .loading {
            text-align: center;
            color: #00d4ff;
            font-style: italic;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            color: #4CAF50;
        }
        .status.error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 MongoDB Integration Dashboard</h1>
            <p>Game Pro Postback System - Real-time Monitoring</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-number" id="userCount">-</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="postbackCount">-</div>
                <div class="stat-label">Total Postbacks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalPoints">-</div>
                <div class="stat-label">Total Points</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgPoints">-</div>
                <div class="stat-label">Avg Points/User</div>
            </div>
        </div>

        <div class="section">
            <h2>🧪 Test MongoDB Integration</h2>
            <div class="test-buttons">
                <button class="btn btn-primary" onclick="testAahan()">Test Aahan Postback</button>
                <button class="btn btn-success" onclick="loadStats()">Refresh Stats</button>
                <button class="btn btn-danger" onclick="clearData()">Clear All Data</button>
            </div>
            <div id="testStatus"></div>
        </div>

        <div class="section">
            <h2>🏆 Top Users Leaderboard</h2>
            <div id="leaderboard">
                <div class="loading">Loading leaderboard...</div>
            </div>
        </div>

        <div class="section">
            <h2>📊 Recent Activity</h2>
            <div id="recentActivity">
                <div class="loading">Loading recent activity...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/mongodb-stats`);
                const data = await response.json();

                // Update stats
                document.getElementById('userCount').textContent = data.collections.users;
                document.getElementById('postbackCount').textContent = data.collections.postbacks;
                document.getElementById('totalPoints').textContent = data.statistics.totalPoints;
                document.getElementById('avgPoints').textContent = data.statistics.averagePointsPerUser;

                // Update leaderboard
                const leaderboardHtml = data.topUsers.length > 0 ? `
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>User</th>
                                <th>Points</th>
                                <th>Tasks</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.topUsers.map((user, index) => `
                                <tr>
                                    <td>${index + 1}</td>
                                    <td>${user.userName}</td>
                                    <td>${user.points}</td>
                                    <td>${user.completedTasks}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                ` : '<p>No users in leaderboard yet.</p>';
                
                document.getElementById('leaderboard').innerHTML = leaderboardHtml;

                // Update recent activity
                const activityHtml = data.recentActivity.length > 0 ? 
                    data.recentActivity.map(activity => `
                        <div class="activity-item">
                            <strong>${activity.user}</strong> earned <strong>${activity.points} points</strong> 
                            from <em>${activity.platform}</em>
                            <br><small>${new Date(activity.receivedAt).toLocaleString()}</small>
                        </div>
                    `).join('') : '<p>No recent activity.</p>';
                
                document.getElementById('recentActivity').innerHTML = activityHtml;

            } catch (error) {
                console.error('Error loading stats:', error);
                showStatus('Error loading statistics: ' + error.message, 'error');
            }
        }

        async function testAahan() {
            showStatus('Testing Aahan postback...', 'success');
            try {
                const response = await fetch(`${API_BASE}/api/test-aahan`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    showStatus('✅ Aahan postback test successful! Check the leaderboard.', 'success');
                    setTimeout(loadStats, 1000); // Refresh stats after 1 second
                } else {
                    showStatus('❌ Test failed: ' + data.error, 'error');
                }
            } catch (error) {
                showStatus('❌ Test error: ' + error.message, 'error');
            }
        }

        async function clearData() {
            if (confirm('Are you sure you want to clear all data? This cannot be undone.')) {
                try {
                    await fetch(`${API_BASE}/api/leaderboard`, { method: 'DELETE' });
                    await fetch(`${API_BASE}/api/received-postbacks`, { method: 'DELETE' });
                    showStatus('✅ All data cleared successfully!', 'success');
                    setTimeout(loadStats, 1000);
                } catch (error) {
                    showStatus('❌ Error clearing data: ' + error.message, 'error');
                }
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('testStatus');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 5000);
        }

        // Load stats on page load
        loadStats();
        
        // Auto-refresh every 30 seconds
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
